<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <title>Nova Alexandria</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <!-- Applies the remembered theme before the first paint; ThemeStore takes over after boot.
         The key and the theme names must match core/theme/theme-store.ts. With no attribute
         (nothing chosen, or "auto") the page is in the revised theme (v2, KBC-124 D2). -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('kb-chat.theme');
          if (
            theme === 'revised' ||
            theme === 'system' ||
            theme === 'light' ||
            theme === 'dark' ||
            theme === 'esoteric'
          )
            document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Figtree, the v2 type, from this server (KBC-124 FR-1, NFR-4): font-display swap. -->
    <link
      rel="preload"
      href="/fonts/figtree/figtree-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
