<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <title>kb-chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies the remembered theme before the first paint (ThemeStore takes over after boot). -->
    <script>
      try {
        var theme = localStorage.getItem('kb-chat.theme');
        if (theme === 'light' || theme === 'dark' || theme === 'esoteric')
          document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
