<div class="frame" [class.active]="active()" [class.best]="best()">
  <button
    type="button"
    class="card"
    [attr.data-doc-id]="hit().id"
    [attr.data-media-id]="media()?.mediaId ?? null"
    [attr.aria-pressed]="active()"
    [attr.aria-label]="trackLabel()"
    [attr.aria-describedby]="trackDescription()"
    (click)="open(hit(), $event)"
  >
    <ui-cover class="art" [title]="hit().title" [size]="44" [label]="false" />
    <span class="body">
      @if (media(); as track) {
        <span class="kind">
          <span class="kind-head">
            <span class="note" aria-hidden="true">♪</span>
            <span i18n="@@trackCard.kind">Faixa</span>
            <span aria-hidden="true">·</span>
            <span class="clock">{{ clock() }}</span>
          </span>
          <span class="recording" [id]="idOf('recording')">
            {{ track.recordingTitle }}
            @if (ordinal(); as where) {
              <span aria-hidden="true">·</span> {{ where }}
            }
          </span>
        </span>
      }
      <span class="title" [id]="idOf('title')">{{ hit().title }}</span>
      <!-- The best card: the authorship badge and "Documento" (bestCard). -->
      <span class="badge-line">
        <app-authorship-badge
          class="authorship"
          [attr.id]="idOf('authorship')"
          [authorship]="hit().authorship"
        />
        @if (!media()) {
          <span class="doc-kind" i18n="@@card.document">Documento</span>
        }
      </span>
      <!-- A row of the table: the author in text, then the type (docRow). -->
      <span class="line" aria-hidden="true">
        <app-authorship-badge
          class="authorship-text"
          [plain]="true"
          [authorship]="hit().authorship"
        />
        @if (genre(); as type) {
          <span class="line-genre">
            @if (hit().authorship) {
              ·
            }
            {{ type }}</span
          >
        }
      </span>
      @if (spoken(); as parts) {
        <span class="snippet spoken" [id]="idOf('snippet')">
          @for (part of parts; track $index) {
            @if (part.marked) {
              <mark>{{ part.text }}</mark>
            } @else {
              <span>{{ part.text }}</span>
            }
          }
        </span>
      } @else {
        <span class="snippet" [id]="idOf('snippet')">{{ hit().snippet }}</span>
      }
      @if (place(); as where) {
        <span class="place" [id]="idOf('place')" i18n="@@card.place"
          >em {{ where }}</span
        >
      }
      @if (facetParts().length > 0) {
        <span class="facets" [id]="idOf('facets')">
          @for (part of facetParts(); track part) {
            @if (!$first) {
              <span class="facet-sep"> · </span>
            }
            <ui-pill class="facet" [tone]="part === central ? 'ok' : 'muted'">{{
              part
            }}</ui-pill>
          }
          @if (copiesBeside()) {
            <!-- bestCard: "+1 cópia" among its pills; the copy is in the card beside. -->
            <ui-pill
              class="facet copies-pill"
              tone="warn"
              i18n="@@card.copies"
              >{hit().copies.length, plural,
                =1 {+1 cópia}
                other {+{{ hit().copies.length }} cópias}
              }</ui-pill
            >
          }
        </span>
      }
      @if (concepts()) {
        <span class="concepts" [id]="idOf('concepts')">
          <span i18n="@@card.concepts">Assuntos:</span> {{ concepts() }}
          @if (extraConcepts()) {
            <span>(+{{ extraConcepts() }})</span>
          }
        </span>
      }
      @if (media(); as track) {
        @if (track.confidence === 'low' || track.stale) {
          <span class="states" [id]="idOf('states')">
            @if (track.confidence === 'low') {
              <span class="low" i18n="@@mediaHit.low">baixa confiança</span>
            }
            @if (track.stale) {
              <span class="stale" i18n="@@trackCard.stale">· atualizando</span>
            }
          </span>
        }
      }
    </span>
  </button>
  <!-- docRow: the depth and the link after the copies' pill, before ⋯ (the card's
       click covers them). -->
  <span class="cols" aria-hidden="true">
    @if (depth(); as level) {
      <span class="col-depth">{{ level }}</span>
    }
    @if (relevance(); as link) {
      <ui-pill [tone]="link === central ? 'ok' : 'info'">{{ link }}</ui-pill>
    }
  </span>
  <ui-menu
    class="more"
    [label]="moreLabel()"
    [triggerLabel]="moreTrigger"
    [triggerDescribedBy]="idOf('title')"
    triggerClass="row-more"
    [menuId]="idOf('more')"
    align="end"
  >
    <ui-icon uiMenuTrigger name="more" [size]="18" />
    <button uiMenuItem type="button" (click)="open(hit(), $event)">
      <ui-icon name="external" [size]="18" />
      <span i18n="@@card.open">Abrir documento</span>
    </button>
    @for (copy of hit().copies; track copy.id) {
      <button uiMenuItem type="button" (click)="open(copy, $event)">
        <ui-icon name="copy" [size]="18" />
        <span class="menu-copy" i18n="@@card.openCopy"
          >Abrir a cópia {{ copy.id }}</span
        >
      </button>
    }
  </ui-menu>
  @if (hit().copies.length > 0 && !copiesBeside()) {
    <div class="copies-area">
      <button
        type="button"
        class="copies-toggle"
        [attr.aria-expanded]="copiesOpen()"
        [attr.aria-controls]="copiesOpen() ? copiesId() : null"
        (click)="toggleCopies()"
        i18n="@@card.copies"
      >
        {hit().copies.length, plural,
          =1 {+1 cópia}
          other {+{{ hit().copies.length }} cópias}
        }
      </button>
      @if (copiesOpen()) {
        <ul class="copies" [id]="copiesId()">
          @for (copy of hit().copies; track copy.id) {
            <li>
              <button
                type="button"
                class="copy"
                [attr.data-doc-id]="copy.id"
                (click)="open(copy, $event)"
              >
                {{ copy.title }} <span class="copy-path">{{ copy.id }}</span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
