<div class="frame" [class.active]="active()">
  <button
    type="button"
    class="card"
    [attr.data-doc-id]="hit().id"
    [attr.data-media-id]="media()?.mediaId ?? null"
    [attr.aria-pressed]="active()"
    [attr.aria-label]="trackLabel()"
    [attr.aria-describedby]="trackDescription()"
    (click)="open(hit(), $event)"
  >
    @if (media(); as track) {
      <span class="kind">
        <span class="kind-head">
          <span class="note" aria-hidden="true">♪</span>
          <span i18n="@@trackCard.kind">Faixa</span>
          <span aria-hidden="true">·</span>
          <span class="clock">{{ clock() }}</span>
        </span>
        <span class="recording" [id]="idOf('recording')">
          {{ track.recordingTitle }}
          @if (ordinal(); as where) {
            <span aria-hidden="true">·</span> {{ where }}
          }
        </span>
      </span>
    }
    <app-authorship-badge
      class="authorship"
      [attr.id]="idOf('authorship')"
      [authorship]="hit().authorship"
    />
    <span class="title">{{ hit().title }}</span>
    @if (spoken(); as parts) {
      <span class="snippet spoken" [id]="idOf('snippet')">
        @for (part of parts; track $index) {
          @if (part.marked) {
            <mark>{{ part.text }}</mark>
          } @else {
            <span>{{ part.text }}</span>
          }
        }
      </span>
    } @else {
      <span class="snippet" [id]="idOf('snippet')">{{ hit().snippet }}</span>
    }
    @if (place(); as where) {
      <span class="place" [id]="idOf('place')" i18n="@@card.place"
        >em {{ where }}</span
      >
    }
    @if (facets()) {
      <span class="facets" [id]="idOf('facets')">{{ facets() }}</span>
    }
    @if (concepts()) {
      <span class="concepts" [id]="idOf('concepts')">
        <span i18n="@@card.concepts">Assuntos:</span> {{ concepts() }}
        @if (extraConcepts()) {
          <span>(+{{ extraConcepts() }})</span>
        }
      </span>
    }
    @if (media(); as track) {
      @if (track.confidence === 'low' || track.stale) {
        <span class="states" [id]="idOf('states')">
          @if (track.confidence === 'low') {
            <span class="low" i18n="@@mediaHit.low">baixa confiança</span>
          }
          @if (track.stale) {
            <span class="stale" i18n="@@trackCard.stale">· atualizando</span>
          }
        </span>
      }
    }
  </button>
  @if (hit().copies.length > 0) {
    <div class="copies-area">
      <button
        type="button"
        class="copies-toggle"
        [attr.aria-expanded]="copiesOpen()"
        [attr.aria-controls]="copiesOpen() ? copiesId() : null"
        (click)="toggleCopies()"
        i18n="@@card.copies"
      >
        {hit().copies.length, plural,
          =1 {+1 cópia}
          other {+{{ hit().copies.length }} cópias}
        }
      </button>
      @if (copiesOpen()) {
        <ul class="copies" [id]="copiesId()">
          @for (copy of hit().copies; track copy.id) {
            <li>
              <button
                type="button"
                class="copy"
                [attr.data-doc-id]="copy.id"
                (click)="open(copy, $event)"
              >
                {{ copy.title }} <span class="copy-path">{{ copy.id }}</span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
