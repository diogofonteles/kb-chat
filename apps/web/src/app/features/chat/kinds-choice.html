<div class="kinds" role="group" [attr.aria-labelledby]="titleId">
  <span class="kinds-title" [id]="titleId" i18n="@@kinds.title">Buscar em</span>
  @for (option of options(); track option.kind) {
    <label
      class="segment"
      [class.on]="option.selected"
      [class.off]="option.disabled"
    >
      <input
        type="checkbox"
        class="segment-input"
        [attr.data-kind]="option.kind"
        [checked]="option.selected"
        [disabled]="option.disabled"
        (change)="toggle(option.kind)"
      />
      <span class="segment-text">
        @if (option.selected) {
          <span class="check" aria-hidden="true">✓</span>
        }
        @if (option.kind === 'audio') {
          <span aria-hidden="true">♪</span>
        }
        <span>{{ option.label }}</span>
      </span>
      @if (option.count) {
        <span class="segment-count">{{ option.count }}</span>
      }
    </label>
  }
</div>
