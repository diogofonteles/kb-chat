<div class="frame" [class.active]="active()">
  <button
    type="button"
    class="card"
    [attr.data-media-id]="hit().mediaId"
    [attr.aria-pressed]="active()"
    (click)="opened.emit()"
  >
    <span class="kind">
      <span class="note" aria-hidden="true">♪</span>
      <span i18n="@@mediaHit.kind">Áudio · Na fala</span>
      <span aria-hidden="true">·</span>
      <span class="clock" aria-hidden="true">{{ clock() }}</span>
      <span class="visually-hidden" i18n="@@mediaHit.at"
        >aos {{ spokenClock() }}</span
      >
    </span>
    <span class="title">{{ hit().title }}</span>
    <span class="snippet">
      @for (part of parts(); track $index) {
        @if (part.marked) {
          <mark>{{ part.text }}</mark>
        } @else {
          <span>{{ part.text }}</span>
        }
      }
    </span>
    <span class="meta">
      <app-authorship-badge [mediaAuthor]="hit().author" />
      @if (place(); as where) {
        <span class="place" i18n="@@card.place">em {{ where }}</span>
      }
      @if (low()) {
        <span class="low" i18n="@@mediaHit.low">baixa confiança</span>
      }
    </span>
  </button>
</div>
