<section class="player" aria-label="Player" i18n-aria-label="@@player.region">
  @if (errorMessage()) {
    <div class="alert" role="alert">
      <p>{{ errorMessage() }}</p>
      <button
        type="button"
        class="retry"
        (click)="retry()"
        i18n="@@player.retry"
      >
        Tentar de novo
      </button>
    </div>
  }

  <app-seek-slider
    [currentMs]="playback().currentMs"
    [durationMs]="playback().durationMs"
    [bufferedEndMs]="playback().bufferedEndMs"
    [disabled]="!operable()"
    (seekRequested)="seekTo($event)"
    (stepRequested)="stepBy($event)"
  />

  <div class="times">
    <span class="elapsed">{{ elapsed() }}</span>
    <button
      type="button"
      class="right-time"
      [attr.aria-label]="rightTimeLabel()"
      [disabled]="playback().durationMs === null"
      (click)="toggleTimeDisplay()"
    >
      {{ rightTime() }}
    </button>
  </div>

  <div class="controls">
    <button
      type="button"
      class="skip"
      [attr.aria-label]="backLabel()"
      aria-keyshortcuts="J"
      [disabled]="!operable()"
      (click)="back()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28">
        <path
          d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"
          fill="currentColor"
        />
      </svg>
      <span class="skip-amount" aria-hidden="true">{{ skipBack() }}</span>
    </button>

    <button
      type="button"
      class="play"
      [attr.aria-label]="playLabel()"
      aria-keyshortcuts="K Space"
      [disabled]="!canPlay()"
      (click)="toggle()"
    >
      @if (busy()) {
        <span class="spinner" aria-hidden="true"></span>
      } @else if (playing()) {
        <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28">
          <path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" />
        </svg>
      } @else {
        <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28">
          <path d="M8 5v14l11-7z" fill="currentColor" />
        </svg>
      }
    </button>

    <button
      type="button"
      class="skip"
      [attr.aria-label]="forwardLabel()"
      aria-keyshortcuts="L"
      [disabled]="!operable()"
      (click)="forward()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28">
        <path
          d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"
          fill="currentColor"
        />
      </svg>
      <span class="skip-amount" aria-hidden="true">{{ skipForward() }}</span>
    </button>
  </div>

  <div class="options" [attr.data-volume]="volumeState()">
    <app-menu-button
      class="speed"
      kind="choice"
      [label]="speedLabel()"
      menuLabel="Velocidade"
      i18n-menuLabel="@@player.speedMenu"
      [options]="speedOptions()"
      keyshortcuts="Shift+. Shift+,"
      (chosen)="chooseSpeed($event)"
    >
      {{ speedShown() }}
    </app-menu-button>

    @if (volumeSupported()) {
      <div class="volume">
        <button
          type="button"
          class="mute"
          aria-label="Silenciar"
          i18n-aria-label="@@player.mute"
          [attr.aria-pressed]="muted()"
          aria-keyshortcuts="M"
          (click)="toggleMute()"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22">
            <path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" />
            @if (muted()) {
              <path
                d="M16 9l5 6M21 9l-5 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            } @else {
              <path
                d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                fill="none"
              />
            }
          </svg>
        </button>
        <input
          type="range"
          class="volume-slider"
          min="0"
          max="100"
          step="5"
          aria-label="Volume"
          i18n-aria-label="@@player.volume"
          [value]="volumePercent()"
          [attr.aria-valuetext]="volumeText()"
          (input)="setVolume($event)"
        />
      </div>
    }

    @if (sleepOn()) {
      <app-menu-button
        class="sleep"
        [label]="sleepLabel()"
        [options]="sleepOptions()"
        (chosen)="chooseSleep($event)"
      >
        <span class="sleep-face"
          ><span aria-hidden="true">☾</span> {{ sleepShown() }}</span
        >
      </app-menu-button>
    }

    <app-menu-button
      class="more"
      label="Mais opções"
      i18n-label="@@player.more"
      keyshortcuts="?"
      [options]="moreOptions"
      (chosen)="chooseMore($event)"
    >
      <span aria-hidden="true">⋯</span>
    </app-menu-button>
  </div>

  @if (ended()) {
    <button
      type="button"
      class="again"
      (click)="playAgain()"
      i18n="@@player.playAgain"
    >
      Ouvir de novo
    </button>
  }
</section>

<app-shortcuts-dialog />
<app-skips-dialog />
<app-sleep-timer-dialog />
