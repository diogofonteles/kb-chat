<section class="player" aria-label="Player" i18n-aria-label="@@player.region">
  @if (errorMessage()) {
    <div class="alert" role="alert">
      <p>{{ errorMessage() }}</p>
      <button
        type="button"
        class="retry"
        (click)="retry()"
        i18n="@@player.retry"
      >
        Tentar de novo
      </button>
    </div>
  }

  <app-seek-slider
    [currentMs]="playback().currentMs"
    [durationMs]="playback().durationMs"
    [bufferedEndMs]="playback().bufferedEndMs"
    [disabled]="!operable()"
    (seekRequested)="seekTo($event)"
    (stepRequested)="stepBy($event)"
  />

  <div class="times">
    <span class="elapsed">{{ elapsed() }}</span>
    <button
      type="button"
      class="right-time"
      [attr.aria-label]="rightTimeLabel()"
      [disabled]="playback().durationMs === null"
      (click)="toggleTimeDisplay()"
    >
      {{ rightTime() }}
    </button>
  </div>

  <div class="controls">
    <button
      type="button"
      class="skip"
      aria-label="Voltar 15 segundos"
      i18n-aria-label="@@player.back15"
      [disabled]="!operable()"
      (click)="back()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28">
        <path
          d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"
          fill="currentColor"
        />
      </svg>
      <span class="skip-amount" aria-hidden="true">15</span>
    </button>

    <button
      type="button"
      class="play"
      [attr.aria-label]="playLabel()"
      [disabled]="!canPlay()"
      (click)="toggle()"
    >
      @if (busy()) {
        <span class="spinner" aria-hidden="true"></span>
      } @else if (playing()) {
        <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28">
          <path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" />
        </svg>
      } @else {
        <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28">
          <path d="M8 5v14l11-7z" fill="currentColor" />
        </svg>
      }
    </button>

    <button
      type="button"
      class="skip"
      aria-label="Avançar 30 segundos"
      i18n-aria-label="@@player.forward30"
      [disabled]="!operable()"
      (click)="forward()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28">
        <path
          d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"
          fill="currentColor"
        />
      </svg>
      <span class="skip-amount" aria-hidden="true">30</span>
    </button>
  </div>

  @if (ended()) {
    <button
      type="button"
      class="again"
      (click)="playAgain()"
      i18n="@@player.playAgain"
    >
      Ouvir de novo
    </button>
  }
</section>
