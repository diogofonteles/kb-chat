@if (confirming()) {
  <div class="confirm" role="group" aria-labelledby="groq-item-question">
    <p id="groq-item-question" i18n="@@groqItem.question">
      Transcrever este áudio com o Groq agora? Custa cerca de
      {{ estimate() }}, descontado do teto mensal da mídia.
    </p>
    <div class="actions">
      <button
        type="button"
        class="primary"
        [disabled]="busy()"
        (click)="confirm()"
        i18n="@@groqItem.confirm"
      >
        Transcrever com Groq
      </button>
      <button
        #cancelButton
        type="button"
        class="secondary"
        (click)="cancel()"
        i18n="@@groqItem.cancel"
      >
        Cancelar
      </button>
    </div>
  </div>
} @else if (media().canUseGroq) {
  <button
    #openButton
    type="button"
    class="secondary"
    (click)="ask()"
    i18n="@@groqItem.open"
  >
    Transcrever com Groq
  </button>
}
@if (error(); as text) {
  <p class="error" role="alert">{{ text }}</p>
}
