<span class="art">
  <ui-cover [title]="item().title" [size]="tile() ? 64 : 180" />
  @if (!tile() && resume()) {
    <!-- How far, as a bar along the cover's foot (v2 Cartão); the words follow below. -->
    <span class="cover-bar" aria-hidden="true"
      ><span [style.width.%]="percent()"></span
    ></span>
  }
  @if (ready()) {
    <button
      type="button"
      class="play"
      [class.on]="playing()"
      [attr.aria-label]="playLabel()"
      (click)="played.emit()"
    >
      <ui-icon
        [name]="playing() ? 'pause' : 'play'"
        [size]="tile() ? 16 : 20"
      />
    </button>
  }
</span>
<span class="body">
  @if (ready()) {
    <a
      class="title"
      [routerLink]="['/midia', item().id]"
      [title]="item().title"
      >{{ item().title }}</a
    >
  } @else {
    <span class="title" [title]="item().title">{{ item().title }}</span>
  }
  <span class="meta">
    <span class="author">{{ authorName() }}</span>
    @if (duration()) {
      <span class="duration">{{ duration() }}</span>
    }
    @if (!resume() && state()) {
      <span class="state">{{ state() }}</span>
    }
  </span>
  @if (resume()) {
    <span class="resume-line" [class.visually-hidden]="!tile()">
      <ui-progress class="position" [value]="percent() / 100" />
      <span class="resume">{{ resume() }}</span>
    </span>
  }
</span>
<ng-content />
