<span class="art">
  <ui-cover [title]="item().title" [size]="64" />
  <button
    type="button"
    class="play"
    [class.on]="playing()"
    [attr.aria-label]="playLabel()"
    (click)="played.emit()"
  >
    <ui-icon [name]="playing() ? 'pause' : 'play'" [size]="16" />
  </button>
</span>
<div class="body">
  <a
    class="title"
    [routerLink]="['/midia', item().id]"
    [queryParams]="startParams()"
    (click)="opened.emit()"
    >{{ item().title }}</a
  >
  <!-- One muted line, "·" between (media-library-search): the album, the author, the length. -->
  <p class="meta">
    <span class="place">{{ meta() }}</span>
    @if (bySubject()) {
      <span i18n="@@library.hit.bySubject">Pelo assunto</span>
    }
  </p>
  @if (passage()) {
    <p class="passage">
      <span class="clock" aria-hidden="true">{{ clock() }}</span>
      <span class="visually-hidden" i18n="@@mediaHit.at"
        >aos {{ spokenClock() }}</span
      >
      <span class="snippet">
        @for (part of parts(); track $index) {
          @if (part.marked) {
            <mark>{{ part.text }}</mark>
          } @else {
            <span>{{ part.text }}</span>
          }
        }
      </span>
    </p>
    @if (low()) {
      <p class="low" i18n="@@mediaHit.low">baixa confiança</p>
    }
  }
</div>
