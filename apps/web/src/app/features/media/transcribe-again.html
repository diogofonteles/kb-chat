@if (media().transcription.lastAttemptFailed && media().canTranscribeAgain) {
  <p class="warning-notice" i18n="@@transcribeAgain.failed">
    A nova transcrição falhou. O texto atual foi mantido.
  </p>
}
<!-- v2 (KBC-129): asked from ⋯ "Transcrever de novo", confirmed in a modal (a sheet on a
     phone) that opens on its safe answer. -->
<ui-dialog
  #dialog
  title="Transcrever de novo?"
  i18n-title="@@transcribeAgain.title"
  titleId="transcribe-again-title"
  [width]="480"
  [top]="300"
  [short]="true"
  (closed)="closed.emit()"
>
  <p class="question" i18n="@@transcribeAgain.question">
    Transcrever de novo com a lista de termos atual? O texto atual continua até
    a nova versão ficar pronta.
  </p>
  @if (error(); as text) {
    <p class="error" role="alert">{{ text }}</p>
  }
  <div uiDialogFooter class="actions">
    <button
      #cancelButton
      uiButton="ghost"
      type="button"
      (click)="dialog.close()"
      i18n="@@transcribeAgain.cancel"
    >
      Cancelar
    </button>
    <button
      uiButton="white"
      type="button"
      [disabled]="busy()"
      (click)="confirm()"
    >
      <ui-icon name="refresh" [size]="18" />
      <span i18n="@@transcribeAgain.confirm">Transcrever de novo</span>
    </button>
  </div>
</ui-dialog>
