name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Lint, typecheck, test, build, format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The media worker's tests convert real audio (KBC-034): ffmpeg and ffprobe.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm --filter @kb-chat/contracts build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kb-chat/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  codex-sandbox:
    # KBC-027 AC-1, ADR 0020: a Codex turn, run by the real runner in the `codex` service of
    # deploy/compose.yml, cannot read the state, the Claude login, the deploy .env or the
    # secrets key (canary copies planted where production keeps them).
    name: Codex sandbox
    # The production VM is arm64 (OCI Ampere): prove the image built for that architecture.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image (it carries the runner and Codex)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: kb-chat-api:proof
          cache-from: type=gha,scope=api-proof
          cache-to: type=gha,mode=max,scope=api-proof
      - name: Block the metadata service for the sandbox, as cloud-init does on the VM
        run: sudo deploy/scripts/codex-egress.sh
      - name: Prove the sandbox
        run: deploy/scripts/codex-sandbox-proof.sh proof docker.io/library
