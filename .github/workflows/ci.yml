name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split so the slowest part (the API's unit tests, ~2.5 min) does not add up with lint,
  # typecheck, build and the other projects' tests: each runs in its own job, in parallel.
  checks:
    name: Lint, typecheck, build, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kb-chat/contracts build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm format:check

  test:
    name: Unit tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            projects: '@kb-chat/api'
            ffmpeg: true
          - name: web
            projects: '@kb-chat/web'
          - name: libs
            projects: '@kb-chat/contracts,@kb-chat/player-core'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The media worker's tests convert real audio (KBC-034): ffmpeg and ffprobe.
      - if: matrix.ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm --filter @kb-chat/contracts build
      - run: pnpm exec nx run-many -t test -p ${{ matrix.projects }}

  e2e:
    # Six shards in parallel: a GitHub runner gives Playwright 2 workers, so one job took
    # ~18 min and four shards up to 5 min; each shard starts its own API and web servers.
    name: E2E (Playwright) ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright's Chromium and WebKit, cached by the lockfile (the Playwright version).
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @kb-chat/e2e exec playwright install chromium webkit
      # System libraries for both, then ffmpeg for the E2E server's media worker (KBC-034).
      - run: pnpm --filter @kb-chat/e2e exec playwright install-deps chromium webkit
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      # Media specs play real AAC: the runner's own Google Chrome (channel "chrome"; the
      # Chromium of Playwright has no AAC/H.264), no download needed.
      - run: google-chrome --version
      - run: pnpm --filter @kb-chat/e2e exec playwright test --shard=${{ matrix.shard }}/6
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 7

  codex-sandbox:
    # KBC-027 AC-1, ADR 0020: a Codex turn, run by the real runner in the `codex` service of
    # deploy/compose.yml, cannot read the state, the Claude login, the deploy .env or the
    # secrets key (canary copies planted where production keeps them).
    name: Codex sandbox
    # The production VM is arm64 (OCI Ampere): prove the image built for that architecture.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image (it carries the runner and Codex)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: kb-chat-api:proof
          cache-from: type=gha,scope=api-proof
          cache-to: type=gha,mode=max,scope=api-proof
      - name: Block the metadata service for the sandbox, as cloud-init does on the VM
        run: sudo deploy/scripts/codex-egress.sh
      - name: Prove the sandbox
        run: deploy/scripts/codex-sandbox-proof.sh proof docker.io/library
