name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What this change needs (tools/ci/select-jobs.mjs): on a pull request only what its paths
  # touch, anything else in full. `verdict`, at the end, reads the result of all of it.
  changes:
    name: Select jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.select.outputs.unit }}
      run_unit: ${{ steps.select.outputs.run_unit }}
      transcriber: ${{ steps.select.outputs.transcriber }}
      codex: ${{ steps.select.outputs.codex }}
      e2e: ${{ steps.select.outputs.e2e }}
      run_e2e: ${{ steps.select.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the pull request's merge commit and its base
      - id: select
        run: node tools/ci/select-jobs.mjs

  # Split so the slowest part (the API's unit tests, ~2.5 min) does not add up with lint,
  # typecheck, build and the other projects' tests: each runs in its own job, in parallel.
  checks:
    name: Lint, typecheck, build, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kb-chat/contracts build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm format:check

  test:
    name: Unit tests (${{ matrix.name }})
    needs: changes
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.unit) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The media worker's tests convert real audio (KBC-034): ffmpeg and ffprobe.
      - if: matrix.ffmpeg
        uses: ./.github/actions/setup-ffmpeg
        timeout-minutes: 5
      - run: pnpm --filter @kb-chat/contracts build
      - run: pnpm exec nx run-many -t test -p ${{ matrix.projects }}

  transcriber:
    # The Mac transcriber (KBC-036, ADR 0023): Python, its own lint and tests, in parallel
    # with the other jobs. Linux takes the CPU-only torch wheel (pyproject) and skips
    # mlx-whisper (Apple silicon only); the tests use a fake model and the real Silero VAD.
    name: Transcriber (ruff, pytest)
    needs: changes
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/transcriber
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: tools/transcriber/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  e2e:
    # Shards in parallel, split per project: a GitHub runner gives Playwright 2 workers, so
    # one job took ~18 min; Playwright cuts a run in order, so plain shards put every slow
    # WebKit media test (real audio) in the last one. Each shard starts its own servers.
    name: E2E (Playwright) ${{ matrix.name }} ${{ matrix.shard }}
    needs: changes
    if: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
        media_workers: ['1', '3']
        name: ['media Chrome']
        browser: ['']
        projects: ['--project=media-desktop --project=media-mobile']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only the browser this group uses (none for Google Chrome, already on the runner),
      # cached by the lockfile (the Playwright version).
      - if: matrix.browser != ''
        uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: matrix.browser != '' && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @kb-chat/e2e exec playwright install ${{ matrix.browser }}
      # WebKit needs system libraries the runner lacks (Chrome's are there); every group
      # needs ffmpeg for the E2E server's media worker (KBC-034).
      - if: matrix.browser == 'webkit'
        run: pnpm --filter @kb-chat/e2e exec playwright install-deps webkit
      - uses: ./.github/actions/setup-ffmpeg
        timeout-minutes: 5
      # Media specs play real AAC: the runner's own Google Chrome (channel "chrome"; the
      # Chromium of Playwright has no AAC/H.264), no download needed.
      - run: google-chrome --version
      - run: pnpm --filter @kb-chat/e2e exec playwright test ${{ matrix.projects }} --shard=${{ matrix.shard }}
        env:
          KBC_E2E_MEDIA_WORKERS: ${{ matrix.media_workers }}
          KBC_WAIT_LOG: /tmp/wait.log
      - if: always()
        run: sort -n /tmp/wait.log | awk '{print "WAIT", $0}'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: e2e/playwright-report
          retention-days: 7

  codex-sandbox:
    # KBC-027 AC-1, ADR 0020: a Codex turn, run by the real runner in the `codex` service of
    # deploy/compose.yml, cannot read the state, the Claude login, the deploy .env or the
    # secrets key (canary copies planted where production keeps them).
    name: Codex sandbox
    needs: changes
    if: false
    # The production VM is arm64 (OCI Ampere): prove the image built for that architecture.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image (it carries the runner and Codex)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: kb-chat-api:proof
          cache-from: type=gha,scope=api-proof
          cache-to: type=gha,mode=max,scope=api-proof
      - name: Block the metadata service for the sandbox, as cloud-init does on the VM
        run: sudo deploy/scripts/codex-egress.sh
      - name: Prove the sandbox
        run: deploy/scripts/codex-sandbox-proof.sh proof docker.io/library

  # The one check that always reports: selected jobs may be skipped, but the selection itself
  # must have worked and nothing that ran may have failed.
  verdict:
    name: CI verdict
    if: always()
    needs: [changes, checks, test, transcriber, e2e, codex-sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          echo "$NEEDS" | jq -e '
            .changes.result == "success" and .checks.result == "success" and
            ([.[].result] | all(. == "success" or . == "skipped"))'
