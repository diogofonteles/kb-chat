# Deploy = merge to main (ADR 0010, KBC-012). Production is the only hosted environment:
# one OCI Always Free Ampere A1 VM running deploy/compose.yml. Every push to main builds the
# two arm64 images on a native arm runner, pushes them to GHCR tagged with the commit SHA,
# then asks the VM (through a forced-command SSH key) to run exactly that SHA and smokes it.
# Rollback: deploy/scripts/rollback.sh on the VM, or re-run this workflow on an older commit.
#
# GitHub environment "production" (Settings -> Environments), set by the owner:
#   secrets: DEPLOY_SSH_KEY (private key of the CI key, ed25519), DEPLOY_KNOWN_HOSTS
#            (`ssh-keyscan -t ed25519 <host>` output), DEPLOY_HOST (VM public IP or name)
#   vars:    KB_CHAT_DOMAIN (public host name), DEPLOY_USER (default "deploy")
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Build ${{ matrix.image }} (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kb-chat-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to production (OCI)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.KB_CHAT_DOMAIN }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      KB_CHAT_DOMAIN: ${{ vars.KB_CHAT_DOMAIN }}
    steps:
      - name: Check the environment is configured
        env:
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$KB_CHAT_DOMAIN" ] || missing="$missing KB_CHAT_DOMAIN"
          [ "$HAS_KEY" = "true" ] || missing="$missing DEPLOY_SSH_KEY"
          [ "$HAS_KNOWN_HOSTS" = "true" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::production environment is missing:$missing (docs/deploy/runbook.md)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Prepare the SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token only lives while this job runs; the VM logs out after pulling.
          printf '%s' "$REGISTRY_TOKEN" |
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA $GITHUB_ACTOR"

      - name: The live release is this commit
        run: |
          live="$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" release)"
          echo "live release: $live"
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::error::the VM runs $live, not $GITHUB_SHA (deploy rolled back?)"
            exit 1
          fi

      - name: Smoke from the internet
        run: bash deploy/scripts/smoke.sh "https://$KB_CHAT_DOMAIN"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${GITHUB_SHA::7} -> https://$KB_CHAT_DOMAIN"
            echo "- images: ghcr.io/${{ github.repository_owner }}/kb-chat-{api,web}:$GITHUB_SHA"
            echo "- result: ${{ job.status }}"
            echo "- rollback: \`sudo /srv/kb-chat/deploy/scripts/rollback.sh\` on the VM"
          } >> "$GITHUB_STEP_SUMMARY"
