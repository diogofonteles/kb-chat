# Sandbox proof (KBC-027 AC-1, ADR 0020), CI only: the `codex` service exactly as in
# compose.yml, except that the runner starts the probe instead of the Codex binary.
services:
  codex:
    environment:
      CODEX_BIN: /probe/probe.mjs
    volumes:
      - ./codex-proof/probe.mjs:/probe/probe.mjs:ro
