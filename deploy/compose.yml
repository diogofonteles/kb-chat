# kb-chat on one VM (ADR 0010): Caddy at the edge, the API on a private network.
# On the VM it runs from /srv/kb-chat/deploy through deploy/scripts/deploy.sh, which
# writes release.env (the image tag) next to this file:
#   docker compose --env-file .env --env-file release.env up -d
# Locally (smoke of the images, no registry):
#   KB_CHAT_TAG=local KB_CHAT_DOMAIN=localhost KB_CHAT_DATA=$PWD/.local \
#     HTTP_PORT=8080 HTTPS_PORT=8443 docker compose -f deploy/compose.yml up -d
name: kb-chat

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  api:
    image: ${KB_CHAT_REGISTRY:-ghcr.io/diogofonteles}/kb-chat-api:${KB_CHAT_TAG:?set KB_CHAT_TAG (release.env)}
    restart: unless-stopped
    init: false # tini is the image's entrypoint
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      KB_VAULT: /vault
      KB_CHAT_STATE_DIR: /data/state
      # Only Caddy reaches the API, over the private network below.
      TRUST_PROXY: uniquelocal
      # The public host, plus loopback for the container healthcheck and the MCP calls of
      # the CLIs the API spawns (ADR 0007), plus its address on the Codex network (ADR 0020).
      # `api` is how the media worker reaches it on the internal network (ADR 0022).
      ALLOWED_HOSTS: ${KB_CHAT_DOMAIN:?set KB_CHAT_DOMAIN (.env)},127.0.0.1,localhost,172.30.0.2,api
      # Codex never runs in this container (KBC-027, ADR 0020): its turns go to the `codex`
      # service, which reaches the turn's MCP endpoint here, by token, from its fixed address.
      KB_CHAT_CODEX_RUNNER_URL: http://172.30.0.10:8790
      KB_CHAT_MCP_PEERS: 172.30.0.10
      # The public origin: the only one the CSRF check accepts (ADR 0008).
      WEB_ORIGIN: ${WEB_ORIGIN:-https://${KB_CHAT_DOMAIN}}
      # Sign-in is required (KBC-010): compose refuses to start without them.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID (.env)}
      KB_CHAT_OWNER_EMAIL: ${KB_CHAT_OWNER_EMAIL:?set KB_CHAT_OWNER_EMAIL (.env)}
      # One-time codes and access notices go by email (KBC-014, ADR 0011/0012): the image runs
      # with NODE_ENV=production, where the API refuses to start without one complete provider:
      # Gmail SMTP (SMTP_USER + SMTP_PASSWORD, the free path) or Resend (RESEND_API_KEY +
      # KB_CHAT_EMAIL_FROM). Blank values count as unset; deploy.sh checks the pair first.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      KB_CHAT_EMAIL_FROM: ${KB_CHAT_EMAIL_FROM:-}
      # SMS codes stay off until the owner picks a provider (ADR 0011); `log` is refused here.
      KB_CHAT_SMS: ${KB_CHAT_SMS:-off}
      # Seals every AI key kept on disk (ADR 0016); the API refuses to start without it. No AI
      # key goes here: the master connects the app's AI in the UI ("IA da aplicação").
      KB_CHAT_SECRETS_KEY: ${KB_CHAT_SECRETS_KEY:?set KB_CHAT_SECRETS_KEY (.env, runbook step 5)}
      # The media library (KBC-034, ADR 0022): off until the owner turns it on (runbook 9d).
      # With `on`, the API refuses to start without a writable /data/media and the token.
      KB_CHAT_MEDIA: ${KB_CHAT_MEDIA:-off}
      KB_CHAT_MEDIA_DIR: /data/media
      KB_CHAT_MEDIA_WORKER_TOKEN: ${KB_CHAT_MEDIA_WORKER_TOKEN:-}
      # Track proposals with the app's AI (KBC-067): model and US$ caps (ADR 0029).
      MEDIA_AI_MODEL: ${MEDIA_AI_MODEL:-deepseek/deepseek-v4-flash}
      MEDIA_MONTHLY_CAP_USD: ${MEDIA_MONTHLY_CAP_USD:-10}
      MEDIA_AI_RUN_CAP_USD: ${MEDIA_AI_RUN_CAP_USD:-0.25}
    volumes:
      # The vault is read-only for the API (Q7); rsync from the owner's Mac writes it.
      - ${KB_CHAT_DATA:-/srv/kb-chat}/vault:/vault:ro
      # QMD index (index.sqlite) and models: qmd needs write access for its WAL files.
      - ${KB_CHAT_DATA:-/srv/kb-chat}/qmd/cache:/home/app/.cache/qmd
      - ${KB_CHAT_DATA:-/srv/kb-chat}/qmd/config:/home/app/.config/qmd
      # Spend ledger, usage, conversations, settings, people and sessions (KBC-010).
      - ${KB_CHAT_DATA:-/srv/kb-chat}/state:/data/state
      # Claude Code login of the owner (`claude /login`, once, over SSH).
      - ${KB_CHAT_DATA:-/srv/kb-chat}/claude:/home/app/.claude
      # The media database and the converted audio (ADR 0022), shared with media-worker.
      - ${KB_CHAT_DATA:-/srv/kb-chat}/media:/data/media
    networks:
      internal: {}
      codex:
        ipv4_address: 172.30.0.2
    mem_limit: ${API_MEM_LIMIT:-8g}
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # The Codex sandbox (KBC-027, ADR 0020): the API image as another user, with only the
  # owner's Codex login mounted: no .env, no state, no Claude login, no secrets key, a
  # read-only root, no capabilities. Opt in with COMPOSE_PROFILES=codex in .env.
  codex:
    image: ${KB_CHAT_REGISTRY:-ghcr.io/diogofonteles}/kb-chat-api:${KB_CHAT_TAG:?set KB_CHAT_TAG (release.env)}
    profiles: [codex]
    restart: unless-stopped
    init: false # tini is the image's entrypoint
    user: '10002:10002'
    command: ['node', 'dist/codex-runner-main.js']
    environment:
      CODEX_HOME: /codex-home
      CODEX_RUNNER_HOST: 0.0.0.0
      CODEX_RUNNER_PORT: '8790'
      # The only MCP endpoint Codex is pointed at, and the only caller of the runner.
      CODEX_MCP_URL: http://172.30.0.2:3000/mcp/turn
      CODEX_RUNNER_CLIENTS: 172.30.0.2
      # Before each turn, kill whatever a former turn left in this container (ADR 0020).
      CODEX_RUNNER_REAP: 'on'
    volumes:
      # The owner's Codex login (`codex login --device-auth`, once, over SSH; runbook 9c).
      - ${KB_CHAT_DATA:-/srv/kb-chat}/codex:/codex-home
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8790/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      codex:
        ipv4_address: 172.30.0.10
    mem_limit: ${CODEX_MEM_LIMIT:-2g}
    pids_limit: 256
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # The media worker (KBC-034, ADR 0022 §3): the API image with another command, capped to
  # 1 CPU and 2 GB so an ffmpeg run never starves the site (the pilot kept HTTP 200 on all
  # 64 checks at this cap). It sees only the media volume and its token: no .env, no state,
  # no logins. Opt in with COMPOSE_PROFILES=media (with KB_CHAT_MEDIA=on, runbook 9d).
  media-worker:
    image: ${KB_CHAT_REGISTRY:-ghcr.io/diogofonteles}/kb-chat-api:${KB_CHAT_TAG:?set KB_CHAT_TAG (release.env)}
    profiles: [media]
    restart: unless-stopped
    init: false # tini is the image's entrypoint
    command: ['node', 'dist/media-worker-main.js']
    environment:
      KB_CHAT_MEDIA_API_URL: http://api:3000
      # Not `:?`: Compose interpolates this service even with the media profile off. The
      # worker refuses to start without a token of 32+ characters (runbook 9d).
      KB_CHAT_MEDIA_WORKER_TOKEN: ${KB_CHAT_MEDIA_WORKER_TOKEN:-}
      KB_CHAT_MEDIA_DIR: /data/media
      KB_CHAT_MEDIA_WORKER_NAME: vm
      FFMPEG_BIN: /usr/bin/ffmpeg
      FFPROBE_BIN: /usr/bin/ffprobe
      KB_CHAT_MEDIA_ALIVE_FILE: /tmp/media-worker.alive
    volumes:
      - ${KB_CHAT_DATA:-/srv/kb-chat}/media:/data/media
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      # The worker touches the file on every loop (at most every 3 s) and on every heartbeat
      # (15 s) while it converts.
      test:
        [
          'CMD',
          'node',
          '-e',
          "const s=require('fs').statSync('/tmp/media-worker.alive');process.exit(Date.now()-s.mtimeMs<120000?0:1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 128
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  web:
    image: ${KB_CHAT_REGISTRY:-ghcr.io/diogofonteles}/kb-chat-web:${KB_CHAT_TAG:?set KB_CHAT_TAG (release.env)}
    restart: unless-stopped
    environment:
      KB_CHAT_DOMAIN: ${KB_CHAT_DOMAIN:?set KB_CHAT_DOMAIN (.env)}
      KB_CHAT_BOARD_DOMAIN: ${KB_CHAT_BOARD_DOMAIN:-board.localhost}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    volumes:
      # Certificates and ACME account: kept across deploys (Let's Encrypt rate limits).
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, board-edge]
    mem_limit: 512m
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

networks:
  internal: {}
  # Caddy reaches the project board hub (its own stack, runbook) only through this one.
  board-edge:
    name: kb-chat-board-edge
  # Only the API and the Codex sandbox (ADR 0020); Codex reaches the internet through it.
  codex:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy-data: {}
  caddy-config: {}
