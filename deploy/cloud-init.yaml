#cloud-config
# First boot of the kb-chat VM (ADR 0010): Ubuntu 24.04 aarch64 on VM.Standard.A1.Flex.
# deploy/oci/provision.sh renders the placeholder below and passes the result as the
# instance's user_data; the owner's personal key goes in the instance metadata
# (ssh_authorized_keys) and lands on the default user "ubuntu" (sudo). The log is
# /var/log/cloud-init-output.log.
#   __CI_SSH_PUBLIC_KEY__  the GitHub Actions deploy key (user "deploy", forced command only)
#
# Nothing here needs the network before /usr/local/sbin/kb-chat-setup runs: the subnet has
# no NAT gateway and the reserved public IP is bound a few seconds after the launch, so the
# setup script waits for egress, installs the packages, and writes the done marker only when
# Docker, the OCI CLI and the data volume are all in place.

swap:
  filename: /swapfile
  size: 4G

users:
  - default
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - restrict,command="/srv/kb-chat/deploy/scripts/ci-gate.sh" __CI_SSH_PUBLIC_KEY__

write_files:
  # SSH: keys only, no root.
  - path: /etc/ssh/sshd_config.d/60-kb-chat.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      AllowUsers ubuntu deploy

  # The CI user may run only the deploy and smoke scripts as root.
  - path: /etc/sudoers.d/60-kb-chat-deploy
    permissions: '0440'
    content: |
      deploy ALL=(root) NOPASSWD: /srv/kb-chat/deploy/scripts/deploy.sh, /srv/kb-chat/deploy/scripts/smoke.sh

  - path: /etc/fail2ban/jail.d/kb-chat.local
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h

  # Security updates every day; reboot at 05:30 UTC when a kernel update needs it
  # (containers come back: restart: unless-stopped).
  - path: /etc/apt/apt.conf.d/52kb-chat-unattended
    permissions: '0644'
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "05:30";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {
        "live-restore": true,
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "5" }
      }

  # Mounts the data block volume at /srv/kb-chat (paravirtualized attachment; consistent
  # device path). Waits for the attachment and formats only a blank volume. No fallback: if
  # the volume is not there, setup fails and the state never lands on the boot volume.
  - path: /usr/local/sbin/kb-chat-mount-volume
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      device=/dev/oracleoci/oraclevdb
      for _ in $(seq 1 60); do [ -e "$device" ] && break; sleep 10; done
      if [ ! -e "$device" ]; then
        echo "kb-chat: block volume $device is not attached; attach it and rerun kb-chat-setup" >&2
        exit 1
      fi
      if ! blkid "$device" >/dev/null 2>&1; then
        mkfs.ext4 -L kb-chat-data "$device"
      fi
      uuid="$(blkid -s UUID -o value "$device")"
      mkdir -p /srv/kb-chat
      # nofail keeps the VM reachable over SSH if the volume is missing at boot; Docker
      # requires the mount (drop-in below), so the containers never start without it.
      grep -q "$uuid" /etc/fstab || echo "UUID=$uuid /srv/kb-chat ext4 defaults,_netdev,nofail,noatime 0 2" >> /etc/fstab
      mountpoint -q /srv/kb-chat || mount /srv/kb-chat
      mountpoint -q /srv/kb-chat

  # Docker (and so every container) starts only with the data volume mounted.
  - path: /etc/systemd/system/docker.service.d/10-kb-chat-data.conf
    permissions: '0644'
    content: |
      [Unit]
      RequiresMountsFor=/srv/kb-chat

  # Everything that needs the network or the volume, in order. The done marker is written
  # only when Docker, the OCI CLI and the mount are verified; bootstrap-vm.sh checks it.
  - path: /usr/local/sbin/kb-chat-setup
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      log() { echo "kb-chat-setup: $*"; }
      export DEBIAN_FRONTEND=noninteractive

      log "waiting for internet egress (the reserved public IP)"
      for _ in $(seq 1 90); do
        curl -fsS --max-time 10 -o /dev/null https://download.docker.com/linux/ubuntu/gpg && break
        sleep 10
      done
      curl -fsS --max-time 10 -o /dev/null https://download.docker.com/linux/ubuntu/gpg ||
        { log "no egress after 15 min: is the reserved IP bound to the VM?"; exit 1; }

      log "mounting the data volume"
      /usr/local/sbin/kb-chat-mount-volume

      log "installing packages"
      # First boot: apt-daily/unattended-upgrades may hold the dpkg lock for a while.
      apt_get() { apt-get -o DPkg::Lock::Timeout=600 "$@"; }
      apt_get update
      apt_get -y upgrade
      install -d -m 0755 /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      fingerprint="$(gpg --show-keys --with-colons /etc/apt/keyrings/docker.asc | awk -F: '/^fpr/ { print $10; exit }')"
      [ "$fingerprint" = "9DC858229FC7DD38854AE2D88D81803C0EBFCD88" ] ||
        { log "unexpected Docker signing key $fingerprint"; exit 1; }
      codename="$(awk -F= '/^VERSION_CODENAME=/ { print $2 }' /etc/os-release)"
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $codename stable" \
        > /etc/apt/sources.list.d/docker.list
      echo "iptables-persistent iptables-persistent/autosave_v4 boolean false" | debconf-set-selections
      echo "iptables-persistent iptables-persistent/autosave_v6 boolean false" | debconf-set-selections
      apt_get update
      apt_get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin \
        fail2ban unattended-upgrades netfilter-persistent iptables-persistent age zstd rsync pipx jq

      log "layout under /srv/kb-chat (app folders owned by uid 10001)"
      mkdir -p /srv/kb-chat/deploy/scripts /srv/kb-chat/vault /srv/kb-chat/qmd/cache /srv/kb-chat/qmd/config \
        /srv/kb-chat/qmd/incoming /srv/kb-chat/state /srv/kb-chat/claude
      chown -R 10001:10001 /srv/kb-chat/qmd/cache /srv/kb-chat/qmd/config /srv/kb-chat/state /srv/kb-chat/claude
      chmod 0700 /srv/kb-chat/state /srv/kb-chat/claude
      chown -R ubuntu:ubuntu /srv/kb-chat/vault /srv/kb-chat/qmd/incoming
      chown root:root /srv/kb-chat/deploy && chmod 0755 /srv/kb-chat/deploy

      log "host firewall, Docker, fail2ban, ssh"
      /usr/local/sbin/kb-chat-open-ports
      systemctl daemon-reload
      systemctl restart docker
      systemctl enable --now fail2ban
      systemctl restart ssh

      log "OCI CLI (backups with the instance principal, no API key on the VM)"
      PIPX_HOME=/opt/pipx PIPX_BIN_DIR=/usr/local/bin pipx install oci-cli

      # --now: "enable" alone waits for the next boot, and a fresh VM is not rebooted, so no
      # backup would run until then (KBC-025).
      systemctl enable --now kb-chat-backup.timer kb-chat-sweep-sessions.timer

      log "verifying"
      mountpoint -q /srv/kb-chat
      systemctl is-active --quiet docker
      systemctl is-active --quiet kb-chat-backup.timer kb-chat-sweep-sessions.timer
      docker compose version
      /usr/local/bin/oci --version
      touch /var/lib/kb-chat-cloud-init-done
      log "done"

  # Oracle's Ubuntu images ship iptables rules that REJECT everything but SSH, even after the
  # security list allows a port. Open 80/443 before the final REJECT, persistently.
  - path: /usr/local/sbin/kb-chat-open-ports
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      rules=/etc/iptables/rules.v4
      for spec in "tcp 80" "tcp 443" "udp 443"; do
        read -r proto port <<<"$spec"
        rule="-A INPUT -p $proto -m state --state NEW -m $proto --dport $port -j ACCEPT"
        grep -qF -- "$rule" "$rules" && continue
        # Insert just before the first REJECT of the INPUT chain.
        awk -v rule="$rule" '!done && /^-A INPUT .*-j REJECT/ { print rule; done = 1 } { print }' "$rules" > "$rules.new"
        mv "$rules.new" "$rules"
      done
      netfilter-persistent reload

  - path: /etc/systemd/system/kb-chat-backup.service
    permissions: '0644'
    content: |
      [Unit]
      Description=kb-chat encrypted state backup to OCI Object Storage
      Wants=network-online.target
      After=network-online.target docker.service
      # No ConditionPathExists: missing settings must fail loudly, not skip in silence.
      OnFailure=kb-chat-backup-failed.service

      [Service]
      Type=oneshot
      Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ExecStart=/srv/kb-chat/deploy/scripts/backup-state.sh
      Nice=10
  # A failed backup is recorded where deploy.sh --status (and the deploy workflow) read it,
  # and logged at error level; the OCI absence alarm covers a VM that stopped altogether.
  - path: /etc/systemd/system/kb-chat-backup-failed.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Record a failed kb-chat backup

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'date -u +"failed %%Y-%%m-%%dT%%H:%%M:%%SZ" > /srv/kb-chat/deploy/backup-status; logger -p user.err -t kb-chat-backup "state backup failed: journalctl -u kb-chat-backup"'
  - path: /etc/systemd/system/kb-chat-backup.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Daily kb-chat state backup (06:30 UTC = 03:30 in Brasília)

      [Timer]
      OnCalendar=*-*-* 06:30:00 UTC
      RandomizedDelaySec=15m
      Persistent=true

      [Install]
      WantedBy=timers.target

  # Abandoned sign-in sessions (ADR 0008): a session file is rewritten on every refresh and
  # expires 30 days after it, so a file untouched for 31 days is expired for sure.
  - path: /etc/systemd/system/kb-chat-sweep-sessions.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Delete expired kb-chat session files
      ConditionPathIsDirectory=/srv/kb-chat/state/sessions

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/find /srv/kb-chat/state/sessions -maxdepth 1 -type f -name '*.json' -mtime +31 -delete
  - path: /etc/systemd/system/kb-chat-sweep-sessions.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Daily sweep of expired kb-chat sessions

      [Timer]
      OnCalendar=daily
      Persistent=true

      [Install]
      WantedBy=timers.target

runcmd:
  # One script, so a failure stops everything after it and no done marker is written.
  - [/usr/local/sbin/kb-chat-setup]
