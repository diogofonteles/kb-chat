[project]
name = "kb-map"
version = "0.1.0"
description = "Collection map: sections with propositions, the subject tree and the compiled wiki over a kb vault, on the owner's Mac (ADR 0039)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6.0.2"]

[project.optional-dependencies]
# The converters of `kb-map convert`/`reconvert` (KBC-148): local and free, heavy (Docling
# brings torch), so only the owner's Mac installs them: `uv sync --extra convert`.
convert = ["docling>=2.30", "markitdown[all]>=0.1.2"]

[project.scripts]
kb-map = "kb_map.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_map"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
ignore = ["PLR2004", "PLR0913", "S603", "S607", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0911", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
