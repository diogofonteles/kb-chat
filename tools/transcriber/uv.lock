    { name = "senko", marker = "platform_machine == 'arm64' and sys_platform == 'darwin' and extra == 'diarize'", git = "https://github.com/narcotic-sh/senko.git?rev=1bcb09041bfa170b4a5a4b0af92f66eff76204d5" },
    { name = "silero-vad", specifier = "==6.2.3" },
    { name = "speechbrain", marker = "platform_machine == 'arm64' and sys_platform == 'darwin' and extra == 'voiceprint'", specifier = "==1.1.2" },
    { name = "torch", marker = "sys_platform != 'linux'", specifier = ">=2.4" },
    { name = "torch", marker = "sys_platform == 'linux'", specifier = ">=2.4", index = "https://download.pytorch.org/whl/cpu" },
